<!DOCTYPE html>
<html>
    <head>
        <title>Penis</title>
        <style> body { margin: 0; overflow: hidden; } </style>
        <script type="importmap">
            { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
        </script>
    </head>
    <body>
        <script type="module">
            import * as THREE from 'three';
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight,
            0.1, 1000);
            camera.position.set(0,8,10);
            camera.lookAt(0,6,0);

            const renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);
            
            const planeGeo = new THREE.PlaneGeometry(200,200);
            const planeMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
            const plane = new THREE.Mesh(planeGeo, planeMat);
            plane.rotation.x = -Math.PI/2;
            plane.receiveShadow = true;
            scene.add(plane);
            
            const dingusGeo = new THREE.PlaneGeometry(1,1);
            const dingus = new THREE.Mesh(dingusGeo, planeMat);
            
            dingus.position.y = -1;
            dingus.rotation.x = -Math.PI/2;
            scene.add(dingus);
            
            const pointLight = new THREE.PointLight(0xffffff, 100, 0);
            pointLight.position.set(6, 10, 6);
            pointLight.castShadow = true;
            dingus.add(pointLight);
            
            const ambientLight = new THREE.AmbientLight(0xaaaaaa);
            scene.add(ambientLight);
            
            const sphereGeo = new THREE.SphereGeometry(1.5,64,32);
            const sphereMat = new THREE.MeshPhongMaterial({ color: 0xf5c298, specular: 0x111111, shininess: 5 });

            const sphereA = new THREE.Mesh(sphereGeo, sphereMat);
            sphereA.position.x = -2;
            sphereA.position.y = 1.5;
            sphereA.castShadow = true;
            scene.add(sphereA);

            const sphereB = new THREE.Mesh(sphereGeo, sphereMat);
            sphereB.position.x = 2;
            sphereB.position.y = 1.5;
            sphereB.castShadow = true;
            scene.add(sphereB);
            
            const length = 8;
            const cylinderGeo = new THREE.CylinderGeometry(1, 1, length, 32);
            const cylinderMat = new THREE.MeshPhongMaterial({ color: 0xf5c298, specular: 0xffffff, shininess: 80 });
            const cylinder = new THREE.Mesh(cylinderGeo, cylinderMat);
            cylinder.position.y = length / 2 +2;
            cylinder.castShadow = true;
            scene.add(cylinder);

            const cylinderGeo2 = new THREE.CylinderGeometry(0.6, 1, 2, 32);
            const cylinder2 = new THREE.Mesh(cylinderGeo2, cylinderMat);
            cylinder2.position.y = 2 + length + 1;
            cylinder2.castShadow = true;
            scene.add(cylinder2);

            window.addEventListener("resize", () => {
                camera.aspect = window.innerWidth/window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            function animate(time) {
                requestAnimationFrame(animate);
                sphereA.rotation.y = time / 2000;
                sphereB.rotation.y = time / 2000;
                dingus.rotation.z = time / 1000;
                renderer.render(scene, camera);
            }
            animate();

        </script>
    </body>
</html>
