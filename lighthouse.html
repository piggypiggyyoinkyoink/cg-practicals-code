<!DOCTYPE html>
<html>
    <head>
        <title>Lighthouse</title>
        <style> body { margin: 0; overflow: hidden; } </style>
        <script type="importmap">
            { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
        </script>
    </head>
    <body>
        <script type="module">
            import * as THREE from 'three';
            // scene and camera setup
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight,
            0.1, 1000);
            camera.position.set(20,9,10);
            camera.lookAt(0,6,0);
            // renderer setup
            const renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);
            // ambient light for general illumination
            const ambientLight = new THREE.AmbientLight(0x222222);
            scene.add(ambientLight);


            // sky - bright blue
            scene.background = new THREE.Color(0x87ceeb);

            // ground - green green grass
            const grassGeo = new THREE.PlaneGeometry(200,100);
            const grassMat = new THREE.MeshLambertMaterial({ color: 0x11ff11 });
            const grass = new THREE.Mesh(grassGeo, grassMat);
            grass.rotation.x = -Math.PI/2;
            grass.position.z = 45;
            grass.receiveShadow = true;
            scene.add(grass);

            // beach - yellow yellow sand
            const beachGeo = new THREE.PlaneGeometry(200,10);
            const beachMat = new THREE.MeshLambertMaterial({ color: 0xffff00 });
            const beach = new THREE.Mesh(beachGeo, beachMat);
            beach.rotation.x = -Math.PI/2;
            beach.position.z = -10;
            beach.receiveShadow = true;
            scene.add(beach);

            // big blue sea sea sea
            const seaGeo = new THREE.PlaneGeometry(200,85);
            const seaMat = new THREE.MeshLambertMaterial({ color: 0x1e90ff });
            const sea = new THREE.Mesh(seaGeo, seaMat);
            sea.rotation.x = -Math.PI/2;
            sea.position.z = -57.5;
            sea.receiveShadow = true;
            scene.add(sea);

            // invisible spinning object used to handle rotations of lighthouse beam
            const dingusGeo = new THREE.PlaneGeometry(1,1);
            const invisMat = new THREE.MeshPhongMaterial({ color: 0xff0000, opacity: 0, specular: 0x1111ff, transparent: true });
            const dingus = new THREE.Mesh(dingusGeo, invisMat);
            dingus.position.y = -1;
            dingus.rotation.x = -Math.PI/2;
            scene.add(dingus);

            // invisible spinning object used for day/night cycle
            const borkus = new THREE.Mesh(dingusGeo, invisMat);
            borkus.position.y = -1;
            scene.add(borkus);

            // invisible target object for lighthouse spotlight
            const invisGeo = new THREE.SphereGeometry(1,1);
            const invis = new THREE.Mesh(invisGeo, invisMat);
            dingus.add(invis);
            invis.position.set(80, 0, -1);
            
            
            // main cylindrical tower of lighthouse
            const towerHeight = 8;
            const towerGeo = new THREE.CylinderGeometry(1, 1, towerHeight, 32);
            const cylinderMat = new THREE.MeshPhongMaterial({ color: 0xffffff, specular: 0xffffff, shininess: 10 });
            const tower = new THREE.Mesh(towerGeo, cylinderMat);
            tower.position.y = towerHeight / 2 ;
            tower.castShadow = true;
            scene.add(tower);

            // gallery and lantern room
            const galleryGeo1 = new THREE.CylinderGeometry(1.5, 1, 0.2, 32);
            const galleryPart = new THREE.Mesh(galleryGeo1, cylinderMat);
            galleryPart.position.y = towerHeight + 0.1;
            galleryPart.castShadow = true;
            scene.add(galleryPart);

            const galleryGeo2 = new THREE.CylinderGeometry(1.5, 1.5, 0.3, 32);
            const galleryPart2 = new THREE.Mesh(galleryGeo2, cylinderMat);
            galleryPart2.position.y = towerHeight + 0.35;
            galleryPart2.castShadow = true;
            scene.add(galleryPart2);

            const lanternGeo = new THREE.CylinderGeometry(1, 1, 1.5, 32);
            const lanternMat = new THREE.MeshPhongMaterial({ color: 0xffffff, specular: 0xffffff, shininess: 2000, opacity: 0.4, transparent: true });
            const lantern = new THREE.Mesh(lanternGeo, lanternMat);
            lantern.position.y = towerHeight + 0.5+0.75;
            lantern.castShadow = true;
            scene.add(lantern);

            // top of lantern room and roof
            const topGeo1 = new THREE.CylinderGeometry(1.5, 1.5, 0.1, 32);
            const top1 = new THREE.Mesh(topGeo1, cylinderMat);
            top1.position.y = towerHeight + 0.5+0.05+1.5;
            top1.castShadow = true;
            scene.add(top1);

            const topGeo2 = new THREE.CylinderGeometry(0.5, 1.5, 0.5, 32);
            const top2 = new THREE.Mesh(topGeo2, cylinderMat);
            top2.position.y = towerHeight + 0.5+0.1+1.5+0.25;
            top2.castShadow = true;
            scene.add(top2);

            const topperGeo = new THREE.SphereGeometry(0.5, 32, 32);
            const topper = new THREE.Mesh(topperGeo, cylinderMat);
            topper.position.y = towerHeight + 0.5+0.1+1/5+1.5+0.25;
            topper.castShadow = true;
            scene.add(topper);

            // light bulb thingy in lantern room
            const lampGeo = new THREE.SphereGeometry(0.2, 16, 16);
            const lampMat = new THREE.MeshPhongMaterial({ color: 0xffff00, specular: 0xffffff, shininess: 1000 });
            const lamp = new THREE.Mesh(lampGeo, lampMat);
            lamp.position.set(0, towerHeight + 0.5 + 0.95, 0);
            lamp.castShadow = true;
            scene.add(lamp);


            // point light to make the exterior of the lantern glow where the beam passes through it
            const pointLight = new THREE.PointLight(0xffffaa, 1000, 1, 900);
            pointLight.position.set(1.41, 0, towerHeight + 0.5+0.75+1);
            pointLight.castShadow = true;
            dingus.add(pointLight);

            // const pointLightHelper = new THREE.PointLightHelper(pointLight);
            // scene.add(pointLightHelper);

            // point light to illuminate the bulb on the side where the beam is
            const pointLight2 = new THREE.PointLight(0xffffaa, 1000, 1);
            pointLight2.position.set(0.75, 0, towerHeight + 0.95 + 0.25+1.15);
            pointLight2.castShadow = true;
            dingus.add(pointLight2);

            // const pointLightHelper2 = new THREE.PointLightHelper(pointLight2);
            // scene.add(pointLightHelper2);

            // point light to illuminate the whole lantern room
            const pointLight3 = new THREE.PointLight(0xffffaa, 5, 2);
            pointLight3.position.set(0, towerHeight + 0.5+0.75, 0);
            pointLight3.castShadow = true;
            scene.add(pointLight3);

            // lighthouse spotlight
            const spotlight = new THREE.SpotLight(0xffffaa, 1000, 0, Math.PI / 16, 0.5);
            spotlight.position.set(1.01, 0, towerHeight + 0.95 + 0.25+1);
            spotlight.target = invis;
            spotlight.castShadow = true;
            dingus.add(spotlight);

            // const spotlightHelper = new THREE.SpotLightHelper( spotlight );
            // scene.add( spotlightHelper );

            // beam of light cutting through the sky
            const beamGeo = new THREE.CylinderGeometry(25, 0.7, 20, 32, 1, true);
            const beamMat = new THREE.MeshBasicMaterial({ color: 0xffffaa, opacity: 0.2, transparent: true, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
            const beam = new THREE.Mesh(beamGeo, beamMat);
            spotlight.add(beam);
            // math to calculate correct angle and position of beam cone
            let spotlightPos = new THREE.Vector3();
            spotlight.getWorldPosition(spotlightPos);
            let targetPos = new THREE.Vector3();
            invis.getWorldPosition(targetPos);
            const beamLength = spotlightPos.distanceTo(targetPos)*2;
            beam.rotation.z = 3*Math.PI / 2;
            let a = Math.atan(Math.abs(targetPos.y - spotlightPos.y) / Math.abs(targetPos.x - spotlightPos.x));
            beam.rotation.y = a;
            beam.scale.set(1, beamLength / 20, 1);
            beam.position.set(beamLength/2 - 0.75, 0, - beamLength * Math.sin(a)/2 + 0.06);

            // "cone" from bulb to start of bem so that the beam isnt just floating in midair
            const coneGeo = new THREE.CylinderGeometry(0.15,0.7, 0.14, 32,1 , true);
            const cone = new THREE.Mesh(coneGeo, beamMat);cone.rotation.x = Math.PI;
            beam.add(cone);
            cone.position.set(0, -10.07, 0)

            const sun = new THREE.DirectionalLight(0xffffee, 0.7);
            sun.position.set(20, 0, 100);
            sun.castShadow = true;
            borkus.add(sun);

            // handle window resizes
            window.addEventListener("resize", () => {
                camera.aspect = window.innerWidth/window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            function lightsOut(){
                pointLight.intensity = 0;
                pointLight2.intensity = 0;
                pointLight3.intensity = 0;
                spotlight.intensity = 0;
                lamp.material.color.set(0x000000);
                beam.visible = false;
            }

            function lightsOn(){
                pointLight.intensity = 1000;
                pointLight2.intensity = 1000;
                pointLight3.intensity = 5;
                spotlight.intensity = 1000;
                lamp.material.color.set(0xffff00);
                beam.visible = true;
            }

            // init
            borkus.rotation.x = 1.5 * Math.PI;
            lightsOut();

            // animation loop
            function animate(time) {

                requestAnimationFrame(animate);
                // rotation of lighthouse beam
                dingus.rotation.z = time / 1500;

                renderer.render(scene, camera);

                // day/night cycle
                let rotation = 1.5 * Math.PI + time / 7000 ;
                // let rotation = 3;
                if (rotation > 2 * Math.PI){
                    rotation = rotation % (2 * Math.PI);
                }
                // rotation of "sun"
                borkus.rotation.x = rotation;
                let val = rotation / Math.PI;
                if (val <= 1 | val == 2){
                    // set sun intensity to 0 at night
                        sun.intensity = 0;

                } else {
                    // funky ahh formula for light intensity changes
                    let i = (2-((Math.abs(1.5-(1.1*(2.4*parseFloat(val)-2.25))))**4))/2;
                    // also smoothly change background lightness as sun rises/sets
                    scene.background = new THREE.Color(0x87ceeb).offsetHSL(0, 0, -0.6 * (1 - i));
                    // make sunlight redder at sunrise/sunset,
                    if (val <= 1.3){
                        let c = new THREE.Color().setRGB(1, Math.max(0, 1-((1.3-val)*1*4)), Math.max(0, 0.855-((1.3-val)*4*0.855)));
                        sun.color = c;
                    }
                    if (val >= 1.7){
                        let c = new THREE.Color().setRGB(1, Math.max(0, 1-((val-1.7)*1*4)), Math.max(0, 0.855 - ((val-1.7)*4*0.855)));
                        sun.color = c;
                    }
                    sun.intensity = Math.max(0, i);
                }
                if (sun.intensity < 0.5){
                    // turn on lighthouse light at night
                    lightsOn();
                } else{
                    // turn off lighthouse light during day
                    lightsOut();
                }
            }
            animate();

        </script>
    </body>
</html>
