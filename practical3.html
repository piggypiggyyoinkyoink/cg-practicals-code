<!DOCTYPE html>
<html>
    <head>
        <title>CG Practical 3</title>
        <style> body { margin: 0; overflow: hidden; } </style>
        <script type="importmap">
            { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
        </script>
    </head>
    <body>
        <script type="module">
            import * as THREE from 'three';
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight,
            0.1, 1000);
            camera.position.set(0,3,8);
            camera.lookAt(0,0,0);

            const renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);
            
            const sphereGeo = new THREE.SphereGeometry(1.5,64,32);
            const planeGeo = new THREE.PlaneGeometry(20,20);
            const planeMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
            const plane = new THREE.Mesh(planeGeo, planeMat);
            plane.rotation.x = -Math.PI/2;
            plane.receiveShadow = true;
            scene.add(plane);
            
            const dingusGeo = new THREE.PlaneGeometry(1,1);
            const dingus = new THREE.Mesh(dingusGeo, planeMat);

            dingus.position.y = -1;
            dingus.rotation.x = -Math.PI/2;
            scene.add(dingus);

            const pointLight = new THREE.PointLight(0xffffff, 100, 0);
            pointLight.position.set(4, 5, 5);
            pointLight.castShadow = true;
            dingus.add(pointLight);

            const ambientLight = new THREE.AmbientLight(0x808080);
            scene.add(ambientLight);

            const matA = new THREE.MeshPhongMaterial({ color: 0x00aaff, specular: 0x111111, shininess: 5 });
            const sphereA = new THREE.Mesh(sphereGeo, matA);
            sphereA.position.x = -2;
            sphereA.position.y = 1.5;
            sphereA.castShadow = true;
            scene.add(sphereA);

            const matB = new THREE.MeshPhongMaterial({ color: 0xffaa00, specular: 0xffffff, shininess: 80 });

            const sphereB = new THREE.Mesh(sphereGeo, matB);
            sphereB.position.x = 2;
            sphereB.position.y = 1.5;
            sphereB.castShadow = true;
            scene.add(sphereB);

            window.addEventListener("resize", () => {
                camera.aspect = window.innerWidth/window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            function animate(time) {
                requestAnimationFrame(animate);
                sphereA.rotation.y = time / 2000;
                sphereB.rotation.y = time / 2000;
                dingus.rotation.z = time / 1000;
                renderer.render(scene, camera);
            }
            animate();

        </script>
    </body>
</html>
